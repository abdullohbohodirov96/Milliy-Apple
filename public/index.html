<style>
:root{--bg:#f2f3f1;--card:#ffffff;--tx:#15181d;--mut:#666d78;--ln:#e3e5e2;--ac:#141414;--acs:#ececea;--acx:#ffffff;--ok:#15803d;--oks:#e5f4ea;--wr:#b45309;--wrs:#fdf1dc;--er:#c62828;--ers:#fbe7e7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--card:#191c21;--tx:#eef0f3;--mut:#9aa1ac;--ln:#2a2e35;--ac:#f4f3ef;--acs:#2b2b2b;--acx:#111111;--ok:#4ade80;--oks:#13291b;--wr:#f5a524;--wrs:#2e2210;--er:#f87171;--ers:#341616}}
:root[data-theme="dark"]{--bg:#101215;--card:#191c21;--tx:#eef0f3;--mut:#9aa1ac;--ln:#2a2e35;--ac:#f4f3ef;--acs:#2b2b2b;--acx:#111111;--ok:#4ade80;--oks:#13291b;--wr:#f5a524;--wrs:#2e2210;--er:#f87171;--ers:#341616}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:24px;margin:16px 0 4px;letter-spacing:-.01em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:4px;padding:10px 8px 10px 14px;background:var(--card);border-bottom:1px solid var(--ln);height:63px}
.top .t1{font-weight:800;font-size:16px}
.ib{position:relative;width:42px;height:42px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;font-size:26px;flex:none}
.ib svg{width:22px;height:22px}
.dot{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--er);color:#fff;font-size:11px;font-style:normal;font-weight:800;line-height:18px}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600}
.bn svg{width:23px;height:23px}
.bn .on{color:var(--ac)}
.pad{padding:12px}
.sec-h{font-weight:800;font-size:15px;margin:20px 2px 8px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.sec-h .t2{font-weight:500}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;min-width:0}
.k .l{font-size:12.5px;color:var(--mut)}
.k .v{font-weight:800;font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.k.ok .v{color:var(--ok)}.k.er .v{color:var(--er)}
.list{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
#plist{margin:0 12px}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:78px;border:0;border-bottom:1px solid var(--ln);background:var(--card);text-align:left}
.row:last-child{border-bottom:0}
.row.sm{min-height:62px}
.th{width:52px;height:52px;flex:none;border-radius:11px;object-fit:cover;background:var(--acs)}
.ph{display:grid;place-items:center;color:var(--ac)}
.ph svg{width:26px;height:26px}
.th.big{width:76px;height:76px}.th.big svg{width:36px;height:36px}
.rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--mut)}
.rr{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bdg{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.rr .bdg{align-self:flex-end}
.bdg.y{background:var(--wrs);color:var(--wr)}.bdg.r{background:var(--ers);color:var(--er)}.bdg.g{background:var(--oks);color:var(--ok)}.bdg.b{background:var(--acs);color:var(--ac)}.bdg.n{background:var(--bg);color:var(--mut)}
.cr{color:var(--er)}.cw{color:var(--wr)}.cg{color:var(--ok)}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:10;background:var(--bg);padding:10px 12px 8px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:0 12px;height:46px}
.search svg{width:19px;height:19px;color:var(--mut);flex:none}
.search input{flex:1;border:0;background:none;font-size:16px;outline:none;min-width:0;height:100%;padding:0;min-height:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;border:0;background:var(--ac);color:var(--acx);font-weight:700;font-size:15px;padding:0 20px;height:50px;border-radius:25px;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-top:10px;min-width:0;font-weight:600}
input,select,textarea{font-size:16px;width:100%;border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:10px 12px;color:var(--tx);min-height:46px;font-weight:500}
input[type=date]{min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.btn{display:block;width:100%;height:50px;border:0;border-radius:13px;background:var(--ac);color:var(--acx);font-weight:700;font-size:15.5px;margin-top:12px}
.btn.ghost{background:var(--acs);color:var(--ac)}
.btn.dg{background:var(--er)}
.btn.dgl{background:var(--ers);color:var(--er)}
.btn.sm{height:44px;margin:0;width:auto;padding:0 18px}
.btn:disabled{opacity:.6}
.sbtn{flex:none;border:0;background:var(--ac);color:var(--acx);border-radius:9px;padding:9px 12px;font-weight:700;font-size:13.5px}
.sbtn.ghost{background:var(--acs);color:var(--ac)}
.sbtn.dgl{background:var(--ers);color:var(--er)}
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,12,16,.48);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sh{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:4px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;overscroll-behavior:contain}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:6px auto 6px}
.shx{display:flex;justify-content:flex-end;margin-bottom:-36px;position:relative;z-index:2}
.shx button{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);font-size:18px}
.sh h2{font-size:20px;margin:6px 44px 4px 0;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fd{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.ov,.sh{animation:none}}
@media (min-width:700px){.ov{align-items:center}.sh{border-radius:20px;max-height:88%}}
.mlist{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.mini{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);width:100%;background:var(--card);border-left:0;border-right:0;border-top:0;text-align:left}
.mini:last-child{border-bottom:0}
button.mini{min-height:56px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
.sumbox{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:6px 12px;margin-top:12px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}
.ln b{white-space:nowrap}
.ln.tot{font-size:16.5px;font-weight:800;border-top:1px solid var(--ln);margin-top:4px;padding-top:9px}
.ln.big{font-size:20px;font-weight:800;color:var(--ok)}
.warn{background:var(--wrs);color:var(--wr);border-radius:10px;padding:9px 11px;font-size:13.5px;margin-top:8px;font-weight:600}
.info{background:var(--acs);color:var(--ac);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;font-weight:600}
.alert{width:100%;display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border-radius:14px;border:1px solid var(--ln);background:var(--card);text-align:left}
.alert .ic{font-size:22px;flex:none}
.alert svg{width:18px;height:18px;color:var(--mut);flex:none}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.qa button{height:50px;border-radius:13px;border:1px solid var(--ln);background:var(--card);font-weight:700;font-size:14.5px}
.qa button:first-child{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.empty{padding:22px 14px;text-align:center;color:var(--mut);font-size:14px}
.cl{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.cl-h{display:flex;gap:8px;align-items:flex-start}
.x{border:0;background:var(--ers);color:var(--er);width:34px;height:34px;border-radius:9px;flex:none;font-weight:800}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:300;background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 10px 26px rgba(0,0,0,.22)}
.toast.er{background:var(--er);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.off{position:fixed;left:0;right:0;top:0;z-index:250;background:var(--er);color:#fff;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;font-size:13.5px;font-weight:700}
.login{max-width:440px;margin:0 auto;padding:36px 16px 40px}
.logo{width:64px;height:64px;border-radius:18px;background:var(--ac);color:var(--acx);display:grid;place-items:center}
.logo svg{width:34px;height:34px}
.av{width:42px;height:42px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:800;flex:none}
.row svg.ch{width:18px;height:18px;color:var(--mut);flex:none}
.note{font-size:12.5px;color:var(--mut);margin-top:16px;line-height:1.55}
.err{color:var(--er);font-weight:700;font-size:14px;margin-top:10px;min-height:20px}
.pw{position:relative}
.pw input{padding-right:52px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:44px;height:40px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.card .im{aspect-ratio:1/1;width:100%;object-fit:cover;background:var(--acs);border-radius:0;height:auto}
.card .ph img.wm{width:46%}
.big-img.ph img.wm{width:110px}
.card .cb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.card .pr{font-weight:800;font-size:15px;margin-top:auto;padding-top:4px}
.add{margin-top:6px;border:0;background:var(--acs);color:var(--ac);border-radius:9px;height:38px;font-weight:700;width:100%}
.big-img{width:100%;max-height:280px;object-fit:contain;border-radius:14px;background:var(--card);display:block}
.row2{display:flex;gap:8px;align-items:center;margin-top:10px}
.up{flex:1;display:grid;place-items:center;height:44px;border:1px dashed var(--ln);border-radius:10px;color:var(--ac);font-weight:700;background:var(--card);cursor:pointer}
.ph-h{display:flex;gap:12px;align-items:center;margin-top:4px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-top:8px;font-weight:600}
.tg input{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--ac)}
.hide{display:none!important}
#splash{position:fixed;inset:0;z-index:1000;background:#000;display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash img{width:min(64vw,260px);height:auto;animation:spl 1s cubic-bezier(.2,.7,.2,1) both}
#splash i{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);width:46px;height:3px;border-radius:2px;background:#333;overflow:hidden}
#splash i::after{content:"";position:absolute;inset:0;width:40%;background:#f4f3ef;animation:bar 1s ease-in-out infinite}
#splash.out{opacity:0;visibility:hidden}
@keyframes spl{from{opacity:0;transform:scale(.9);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash img,#splash i::after{animation:none}}
.wm{filter:invert(1);opacity:.32}
:root[data-theme="dark"] .wm{filter:none;opacity:.4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{filter:none;opacity:.4}}
.ph img.wm{width:46%;height:auto}
.empty img.wm{display:block;width:34px;height:34px;margin:0 auto 8px}
.hcard{border:1px solid #262626;display:flex;align-items:center;gap:14px;background:#000;color:#f4f3ef;border-radius:18px;padding:14px 16px;margin-bottom:4px}
.hcard img{width:52px;height:52px;border-radius:12px;flex:none}
.hcard .brand{font-size:17px;letter-spacing:.14em}
.hcard .t2{color:#a9a9a6}
.shero{background:#000;color:#f4f3ef;text-align:center;padding:18px 16px 16px}
.shero img{width:132px;height:132px;display:block;margin:0 auto}
.shero p{margin:4px 0 0;font-size:13.5px;color:#a9a9a6;letter-spacing:.02em}
.brand{font-family:Montserrat,Manrope,system-ui,sans-serif;font-weight:700;letter-spacing:.06em}
.hmark{width:38px;height:38px;border-radius:10px;flex:none;margin-right:8px;display:block}
.hero{text-align:center;margin-bottom:8px}
.blogo{width:140px;height:140px;border-radius:30px;display:block;margin:0 auto 6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;width:38px;height:36px;border-radius:8px;display:grid;place-items:center}
.seg button svg{width:18px;height:18px}
.seg .on{background:var(--acs);color:var(--ac)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--ln);background:var(--card);font-weight:800;font-size:17px}
.doc{background:#fff;color:#000;padding:16px;border-radius:10px;font-size:13.5px;border:1px solid var(--ln)}
.doc h3{margin:0 0 2px;font-size:17px}
.doc table{width:100%;border-collapse:collapse;margin-top:10px}
.doc td{padding:5px 0;border-bottom:1px dashed #bbb;vertical-align:top}
.doc td:last-child{text-align:right;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
/* ===== Noutbuk va planshet ko‘rinishi ===== */
.side,.ptl{display:none}
@media (min-width:700px){
 .m-admin main>.pad,.m-admin main>.stick,.m-admin #plist{max-width:920px;margin-left:auto;margin-right:auto}
 .m-admin #plist{width:calc(100% - 24px)}
 .kp,.qa{grid-template-columns:repeat(4,1fr)}
 .m-shop .grid{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:1024px){
 .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:252px;z-index:40;background:#000;color:#d6d6d2;padding:18px 12px 16px;overflow-y:auto;border-right:1px solid #1e1e1e}
 .side-brand{display:flex;gap:12px;align-items:center;padding:4px 8px 20px}
 .side-brand img{width:46px;height:46px;border-radius:12px;flex:none}
 .side-brand .brand{font-size:15px;letter-spacing:.14em;color:#fff}
 .side-brand .t2{color:#8d8d8a}
 .si{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#cfcfcb;padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:600;text-align:left;transition:background .15s,color .15s}
 .si svg{width:20px;height:20px;flex:none;opacity:.9}
 .si:hover{background:#161616;color:#fff}
 .si.on{background:#f4f3ef;color:#000}
 .si .cnt{margin-left:auto;background:#c62828;color:#fff;border-radius:9px;font-size:11px;font-style:normal;font-weight:800;padding:1px 7px}
 .side-sec{font-size:12px;color:#6f6f6c;margin:18px 12px 6px;font-weight:700}
 .side .grow{flex:1;min-height:16px}
 .m-admin .top,.m-admin main{margin-left:252px}
 .m-admin .top{padding:10px 24px;height:68px}
 .m-admin .top .hmark,.m-admin .top .rm{display:none}
 .m-admin .ptl{display:block;flex:1;font-weight:800;font-size:21px;letter-spacing:-.01em}
 .m-admin .bn{display:none}
 .m-admin main{padding-bottom:40px}
 .m-admin main>.pad,.m-admin main>.stick,.m-admin #plist{max-width:1180px}
 .m-admin .pad{padding:22px 28px}
 .m-admin .stick{top:68px;padding:16px 28px 10px}
 .m-admin #plist{width:calc(100% - 56px);display:grid;grid-template-columns:1fr 1fr;margin-bottom:28px}
 .m-admin #plist>.row{border-right:1px solid var(--ln)}
 .m-admin #plist>.row:nth-child(2n){border-right:0}
 .m-admin #plist>.row:nth-last-child(2):nth-child(odd){border-bottom:0}
 .m-admin .fab{bottom:28px;right:32px}
 .hcard{padding:20px 22px}.hcard img{width:60px;height:60px}.hcard .brand{font-size:19px}
 .sgrid.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
 .sgrid.two .sale-r{position:sticky;top:84px}
 .sgrid.two .sale-r>.sec-h:first-child{margin-top:0}
 .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
 .m-shop .shero{padding:40px 16px 32px}.m-shop .shero img{width:180px;height:180px}
 .m-shop .stick,.m-shop .grid,.m-shop .pad,.m-shop .list{max-width:1180px;margin-left:auto!important;margin-right:auto!important}
 .m-shop .stick{padding:16px 24px 10px}
 .m-shop .grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:0 24px}
 .sh{max-width:600px}
}

 .m-auth{min-height:100vh;display:grid;place-items:center;padding:32px}
 .m-auth .login{max-width:1000px;width:100%;display:grid;grid-template-columns:1fr 1fr;column-gap:56px;align-items:start;padding:0 48px 0 0;background:var(--card);border:1px solid var(--ln);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.12)}
 .m-auth .login>.hero{grid-column:1;grid-row:1/span 40;align-self:stretch;margin:0;min-height:600px;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:#f4f3ef}

/* ===== Animatsiyalar ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:none}}
@keyframes flashBg{0%{background:var(--oks);box-shadow:inset 4px 0 0 var(--ok)}70%{background:var(--oks);box-shadow:inset 4px 0 0 var(--ok)}100%{background:var(--card);box-shadow:inset 4px 0 0 transparent}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes ovOut{to{opacity:0}}@keyframes shOut{to{transform:translateY(70px);opacity:0}}
@keyframes chk{to{stroke-dashoffset:0}}@keyframes okIn{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.06)}100%{transform:none}}
@keyframes clOut{to{opacity:0;transform:translateX(40px)}}
.enter .k,.enter .alert,.enter .qa,.enter .hcard,.enter .list>.row,.enter #plist>.row,.enter .card,.enter .grid,.enter .sumbox,.enter .mlist,.enter .cl,.enter .shero img{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}
.flash,.enter .flash,.enter #plist>.row.flash,.enter .list>.row.flash{animation:pop .4s cubic-bezier(.2,.7,.2,1) both,flashBg 2.4s ease-out both!important;animation-delay:0ms!important}
.pop{animation:pop .35s cubic-bezier(.2,.7,.2,1) both}
.bump{animation:bump .45s ease}
.toast{animation:toastIn .28s cubic-bezier(.2,.7,.2,1)}
.toast.out{opacity:0;transition:opacity .25s}
.ov.closing{animation:ovOut .2s ease forwards;pointer-events:none}
.ov.closing .sh{animation:shOut .2s ease forwards}
.cl.out{animation:clOut .18s ease forwards}
.btn,.sbtn,.qa button,.chip,.add,.fab,.ib,.x{transition:transform .12s ease}
.btn:active,.sbtn:active,.qa button:active,.chip:active,.add:active,.fab:active,.ib:active,.x:active{transform:scale(.96)}
.row:active,button.mini:active{background:var(--bg)}
.fly{position:fixed;z-index:400;pointer-events:none;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.fly img{width:100%;height:100%;object-fit:cover;display:block}
.okfx{position:fixed;inset:0;z-index:350;display:grid;place-items:center;pointer-events:none;transition:opacity .3s}
.okfx div{width:96px;height:96px;border-radius:50%;background:var(--ok);display:grid;place-items:center;animation:okIn .45s cubic-bezier(.2,.7,.2,1) both;box-shadow:0 14px 34px rgba(21,128,61,.35)}
.okfx svg{width:52px;height:52px}
.okfx path{stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:chk .35s .25s ease forwards}
.okfx.out{opacity:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}.flash,.enter .flash,.enter #plist>.row.flash,.enter .list>.row.flash{animation:none!important}}
@media print{body>*:not(.ov){display:none!important}.ov{position:static;background:none;display:block}.sh{max-height:none;background:#fff;padding:0}.sh>*:not(.doc){display:none!important}.doc{border:0}}
</style>

 const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=sp(Math.round(to*e))+suf;if(k<1)requestAnimationFrame(step);else el.textContent=sp(to)+suf};requestAnimationFrame(step)})}

 const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:150000},key,256);return {salt:b64(salt),hash:b64(bits)}}
const same=(a,b)=>{if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0};

function createSale(d){
 if(d.token){const ex=S.sales.find(s=>s.token===d.token);if(ex)return ex} /* idempotentlik */
 for(const l of d.lines){const p=gp(l.pid);
  if(l.uid){const u=gu(l.uid);if(!u||u.status!=='stock')throw new Error(`${title(p)} (${u?u.imei1:'?'}) allaqachon sotilgan yoki mavjud emas`)}
  else if(stock(l.pid)<l.qty)throw new Error(`${title(p)}: omborda ${stock(l.pid)} dona bor`)}
 const items=d.lines.map(l=>{let cost,alloc=null;
  if(l.uid){const u=gu(l.uid);cost=u.cost;u.status='sold';u.soldAt=d.ts}
  else{alloc=fifoTake(l.pid,l.qty);cost=alloc.reduce((a,x)=>a+x.q*x.c,0)}
  return {pid:l.pid,uid:l.uid||null,qty:l.qty,price:l.price,disc:l.disc||0,cost,alloc,rq:0,rv:0,rc:0}});
 const total=items.reduce((a,i)=>a+i.price*i.qty-i.disc,0);
 const s={id:nid(),no:S.sales.reduce((a,x)=>Math.max(a,x.no),0)+1,date:d.ts,seller:d.seller,cust:d.cust||null,items,total,retV:0,token:d.token||null,order:d.order||null,dueDate:d.dueDate||null,cancelled:null};
 S.sales.push(s);
 if(d.cash||d.card)S.payments.push({id:nid(),sale:s.id,date:d.ts,cash:d.cash||0,card:d.card||0,type:'sale',by:d.seller});
 log('Sotuv',`№${s.no}, ${m(total)}`,d.seller);return s}
function returnCore(s,i,q,toStock,now,reason){const it=s.items[i];
 const last=it.rq+q===it.qty,net=it.price*it.qty-it.disc;const val=last?net-it.rv:Math.round(net*q/it.qty);let cost=0;
 if(it.uid){const u=gu(it.uid);cost=it.cost;u.status=toStock?'stock':'faulty';u.retDate=now}
 else{let need=q;for(const a of [...it.alloc].reverse()){const t=Math.min(need,a.q-a.r);if(!t)continue;a.r+=t;need-=t;cost+=t*a.c;if(toStock){const b=S.batches.find(x=>x.id===a.b);if(b)b.left+=t}if(!need)break}
  if(!toStock)S.writeoffs.push({id:nid(),date:now,pid:it.pid,uid:null,qty:q,cost,reason:'Qaytarilgan nosoz aksessuar',by:me()?.name})}
 it.rq+=q;it.rv+=val;it.rc+=cost;s.retV+=val;
 S.returns.push({id:nid(),sale:s.id,date:now,pid:it.pid,qty:q,value:val,cost,toStock,seller:s.seller,reason:reason||''});return val}
function refundExtra(s,method,now){const paid=paidOf(s),newNet=s.total-s.retV;if(paid<=newNet)return 0;const r=paid-newNet;
 S.payments.push({id:nid(),sale:s.id,date:now,cash:method==='card'?0:-r,card:method==='card'?-r:0,type:'refund',by:me()?.name});return r}

 const q=num($('#be_q').value),base=num($('#be_base').value),ext=num($('#be_ext').value);if(!q||!base)return toast('Soni va narxni kiriting','er');

 log('Partiya tahrirlandi',`${title(gp(b.pid))}: ${b.qty}×${b.base} → ${q}×${base}`);b.qty=q;b.left=q;b.base=base;b.ext=ext;b.cost=base+ext;save();render();batchSheet(bid);toast('Saqlandi','ok')}

function kpCh(){const pv=$('#kp').value;const isNew=pv==='new';const cat=isNew?$('#kc').value:gp(+pv).cat;const cond=isNew?$('#kcond').value:gp(+pv).cond;

function saveKirim(){if(!need('kirim'))return;const v=id=>$('#'+id).value.trim();const pv=v('kp');let p;
 if(pv==='new'){const b=v('kb'),mo=v('km');if(!b||!mo)return toast('Brend va modelni kiriting','er');const pr=num(v('kpr'));if(!pr)return toast('Sotuv narxini kiriting','er');

 if(!(raw>0))return toast('Xarid narxini kiriting','er');if(cur==='USD'&&!rate)return toast('Dollar kursini kiriting','er');

  for(const l of lines){const [a0,b0='']=l.split(/[,;\s]+/).filter(Boolean);const a=a0.toUpperCase(),b=b0.toUpperCase();const ok=x=>/^[A-Z0-9]{6,20}$/.test(x);

 if(p.cat==='acc')S.batches.push({id:nid(),pid:p.id,qty:n,left:n,cost:unitCost,base,ext,cur,orig:raw,rate:cur==='USD'?rate:null,inDate:now,sup,pur:pur.id});

function cartCalc(){let total=0,cost=0;const warn=[];const ad=isAdmin(),cc=canCost();
 S.ui.scart.forEach(l=>{const p=gp(l.pid);const gross=l.price*l.qty,net=gross-(l.disc||0);total+=net;const lc=lineCost(l);cost+=lc;
  if(net<lc)warn.push(cc?`${title(p)}: tannarxdan ${sp(lc-net)} so‘m past`:`${title(p)}: narx ruxsat etilgan minimumdan past`);
  const pct=gross?(l.disc||0)*100/gross:0;if(pct>S.settings.discLimit)warn.push(`${title(p)}: chegirma ${Math.round(pct)}%, limit ${S.settings.discLimit}%`)});
 const cash=S.ui.pay.cash||0,card=S.ui.pay.card||0,given=cash+card;let change=0,err='';
 if(given>total){if(card>total)err='Karta summasi savdodan katta bo‘lishi mumkin emas';else{change=given-total;if(change>cash)err='Qaytim naqd puldan katta bo‘lib qoldi'}}
 const paid=Math.min(given,total);return {total,cost,given,paid,change,cashNet:cash-change,card,debt:total-paid,warn,ad,err}}
function sumHtml(){const c=cartCalc(),cc=canCost();const dw=$('#duew');if(dw)dw.classList.toggle('hide',!(c.debt>0));
 return `<div class="sumbox">${line('Jami',m(c.total),'tot')}${line('Mijoz berdi',m(c.given))}${c.change?line('Qaytim bering',m(c.change),'big'):''}${c.debt>0?line('Nasiya (qarz)',m(c.debt),'cr'):''}${cc?line('Kutilayotgan yalpi foyda',m(c.total-c.cost)):''}</div>
 ${c.err?`<div class="warn">⚠️ ${c.err}</div>`:''}${c.warn.map(w=>`<div class="warn">⚠️ ${esc(w)}${c.ad?'':' — admin ruxsati kerak'}</div>`).join('')}${c.debt>0?`<div class="warn">Nasiya savdoda mijoz ismi va telefoni majburiy</div>`:''}`}
function updSum(){const e=$('#ssum');if(e)e.innerHTML=sumHtml()}
function confirmSale(){const c=cartCalc();if(c.total<=0)return toast('Savdo summasi noldan katta bo‘lishi kerak','er');if(c.err)return toast(c.err,'er');
 const sc=S.ui.scust;let cust=null;
 if(sc.id==='new'){if(sc.name?.trim()||normPhone(sc.phone)){if(!sc.name?.trim())return toast('Mijoz ismini kiriting','er');if(!validPhone(sc.phone))return toast('Telefon raqami noto‘g‘ri','er');cust='new'}}
 else if(sc.id)cust=sc.id;
 if(c.debt>0&&!cust)return toast('Nasiya uchun mijoz ismi va telefonini kiriting','er');
 let due=null;if(c.debt>0){const d=$('#pdue')?.value||S.ui.due;if(!d||d<dkey(Date.now()))return toast('Qarzni qaytarish sanasini tanlang','er');due=dateTs(d)}
 if(c.warn.length&&!c.ad)return toast('Bu narx yoki chegirma uchun admin ruxsati kerak','er');
 const go2=()=>doSale(cust,c,due);
 if(c.warn.length)askConfirm('Ogohlantirish:\n'+c.warn.join('\n')+'\n\nBaribir sotilsinmi?',go2,'Ha, sotish');else go2()}
function doSale(cust,c,due){const btn=$('#sbtn');setBusy(btn,true,'Saqlanmoqda…');
 if(!S.ui.token)S.ui.token='t'+Date.now()+Math.random().toString(36).slice(2,7);
 setTimeout(()=>{try{
  if(!navigator.onLine)throw new Error('Internet yo‘q. Savdo saqlanmadi.');
  if(!me())throw new Error('Sessiya tugagan. Qayta kiring.');
  if(cust==='new'){const sc=S.ui.scust;let ex=S.customers.find(x=>normPhone(x.phone)===normPhone(sc.phone));if(!ex){ex={id:nid(),name:sc.name.trim(),phone:sc.phone.trim(),note:''};S.customers.push(ex)}cust=ex.id}
  const s=createSale({lines:S.ui.scart.map(l=>({...l})),cust,cash:c.cashNet,card:c.card,ts:Date.now(),seller:me().name,token:S.ui.token,order:S.ui.fromOrder,dueDate:due});
  if(S.ui.fromOrder){const o=S.orders.find(x=>x.id===S.ui.fromOrder);if(o){o.status='yakunlandi';o.saleId=s.id}}
  S.ui.scart=[];S.ui.pay={cash:0,card:0};S.ui.scust={id:''};S.ui.due='';S.ui.fromOrder=null;S.ui.token=null;flashOn('sale',s.id);save();render();okFx();
  toast(c.change?`Sotildi. Qaytim: ${sp(c.change)} so‘m`:`Sotildi: savdo №${s.no}`,'ok');saleSheet(s.id)
 }catch(e){toast(e.message,'er');setBusy(btn,false);save();render()}},300)}

 <div class="sumbox">${line('Savdo summasi',m(s.total))}${s.retV?line('Qaytarilgan',m(-s.retV)):''}${line('To‘langan',m(paidOf(s)))}${line('Qolgan qarz',m(Math.max(0,due)),'tot '+(due>0?'cr':''))}${s.dueDate&&due>0?line('Qaytarish muddati',fd(s.dueDate),dkey(s.dueDate)<dkey(Date.now())?'cr':''):''}${cc?line('Yalpi foyda',m(saleProfit(s))):''}</div>
 <div class="sec-h">To‘lovlar tarixi</div><div class="mlist">${pays.map(p=>`<div class="mini"><span class="rm"><b>${payLabel(p)}</b><span class="t2">${fdt(p.date)}${p.cash?`, naqd ${sp(p.cash)}`:''}${p.card?`, karta ${sp(p.card)}`:''}${p.by?', '+esc(p.by):''}</span></span><b>${sp(p.cash+p.card)}</b>${ad&&p.type==='debt'&&!p.rev&&!p.voided?`<button class="sbtn dgl" onclick="voidPay(${p.id})">Bekor</button>`:''}</div>`).join('')||empty('To‘lov hali yo‘q')}</div>

 <button class="btn ghost" onclick="docSheet(${id})">🧾 Savdo hujjati</button>

 log('Qaytarish',`№${s.no}, ${title(gp(it.pid))} × ${q}, ${m(val)}${refund?`, pul qaytarildi ${m(refund)}`:''}`);save();render();saleSheet(id);toast(refund?`Qaytarildi. Mijozga ${sp(refund)} so‘m bering`:'Qaytarish saqlandi','ok')}

/* ---------- Hisobot ---------- */
function perRange(){const now=Date.now(),t=dkey(now);switch(S.ui.per){case 'yest':{const y=dkey(now-DAY);return [y,y]}case '7':return [dkey(now-6*DAY),t];case 'month':return [t.slice(0,8)+'01',t];case 'custom':{let a=S.ui.ca||t,b=S.ui.cb||t;if(a>b)[a,b]=[b,a];return [a,b]}default:return [t,t]}}
function report(A,B){const inP=x=>{const k=dkey(x);return k>=A&&k<=B};
 const r={n:0,gross:0,disc:0,retV:0,retC:0,retN:0,cogs:0,cnt:{phone:0,tablet:0,acc:0},exp:0,wo:0,byP:{},bySel:{},cashSale:0,cashDebt:0,refunds:0,supPaid:0,ownIn:0,ownOut:0,kdiff:0};
 S.sales.forEach(s=>{if(!inP(s.date))return;r.n++;const y=r.bySel[s.seller]||(r.bySel[s.seller]={n:0,rev:0,pr:0});y.n++;
  s.items.forEach(it=>{const p=gp(it.pid),net=it.price*it.qty-it.disc;r.gross+=it.price*it.qty;r.disc+=it.disc;r.cogs+=it.cost;if(p)r.cnt[p.cat]+=it.qty;
   const x=r.byP[it.pid]||(r.byP[it.pid]={q:0,rev:0,pr:0});x.q+=it.qty;x.rev+=net;x.pr+=net-it.cost;y.rev+=net;y.pr+=net-it.cost})});
 S.returns.forEach(x=>{if(!inP(x.date))return;r.retV+=x.value;r.retC+=x.cost;r.retN+=x.qty;const b=r.byP[x.pid];if(b){b.q-=x.qty;b.rev-=x.value;b.pr-=x.value-x.cost}const y=r.bySel[x.seller];if(y){y.rev-=x.value;y.pr-=x.value-x.cost}});
 r.net=r.gross-r.disc-r.retV;r.cogsN=r.cogs-r.retC;r.gp=r.net-r.cogsN;
 S.expenses.forEach(e=>{if(!e.del&&inP(e.date))r.exp+=e.amount});S.writeoffs.forEach(w=>{if(inP(w.date))r.wo+=w.cost});r.res=r.gp-r.exp-r.wo;
 S.payments.forEach(p=>{if(!inP(p.date))return;const a=p.cash+p.card;if(p.type==='sale')r.cashSale+=a;else if(p.type==='debt')r.cashDebt+=a;else r.refunds+=a});
 r.cashNet=r.cashSale+r.cashDebt+r.refunds;
 S.purchases.forEach(p=>{if(inP(p.date))r.supPaid+=p.paid+(p.extra||0)});S.supPays.forEach(p=>{if(inP(p.date))r.supPaid+=p.amount});
 S.owner.forEach(o=>{if(o.del||!inP(o.date))return;if(o.type==='in')r.ownIn+=o.amount;else r.ownOut+=o.amount});
 S.closings.forEach(c=>{if(inP(c.date))r.kdiff+=c.diff});
 r.flow=r.cashNet-r.exp-r.supPaid+r.ownIn-r.ownOut+r.kdiff;return r}
function repV(){const [A,B]=perRange();const r=report(A,B),cc=canCost();
 const chips=[['today','Bugun'],['yest','Kecha'],['7','7 kun'],['month','Bu oy'],['custom','Oraliq']];
 const top=Object.entries(r.byP).filter(([,v])=>v.q>0);const byQ=[...top].sort((a,b)=>b[1].q-a[1].q).slice(0,5),byPr=[...top].sort((a,b)=>b[1].pr-a[1].pr).slice(0,5);
 const low=S.products.filter(p=>!p.archived&&p.cat==='acc'&&stock(p.id)<=p.min);
 return `<div class="stick"><div class="chips" style="padding-top:0">${chips.map(([k,l])=>`<button class="chip ${S.ui.per===k?'on':''}" onclick="S.ui.per='${k}';save();render()">${l}</button>`).join('')}</div>
 ${S.ui.per==='custom'?`<div class="g2" style="margin-top:6px"><input type="date" value="${A}" onchange="S.ui.ca=this.value;save();render()" aria-label="Boshlanish"><input type="date" value="${B}" onchange="S.ui.cb=this.value;save();render()" aria-label="Tugash"></div>`:''}</div>
 <section class="pad" style="padding-top:0"><div class="t2" style="margin:2px 2px 8px">${A===B?A:A+' — '+B}, Toshkent vaqti</div>
 <div class="kp">${kpi('Sotuvlar soni',r.n+' ta')}${kpi('Sof savdo tushumi',m(r.net))}${cc?kpi('Sotilgan tovar tannarxi',m(r.cogsN))+kpi('Yalpi foyda',m(r.gp),r.gp>=0?'ok':'er')+kpi('Operatsion xarajat',m(r.exp))+kpi('Tovar yo‘qotish',m(r.wo))+kpi('Hisoblangan sof natija',m(r.res),r.res>=0?'ok':'er'):''}${kpi('Kelib tushgan pul',m(r.cashNet))}${kpi('Telefon / planshet / aksessuar',`${r.cnt.phone} / ${r.cnt.tablet} / ${r.cnt.acc}`)}</div>
 ${cc?`<p class="note" style="margin-top:8px">Sof natija soliqlarsiz hisoblangan. Foyda savdo bo‘yicha, pul esa amalda tushgan to‘lovlar bo‘yicha alohida ko‘rsatiladi.</p>`:''}
 <div class="rgrid">
 <div class="rsec"><div class="sec-h">Pul harakati</div><div class="sumbox">${line('Savdodagi to‘lovlar',m(r.cashSale))}${line('Undirilgan qarzlar',m(r.cashDebt))}${line('Mijozga qaytarilgan',m(r.refunds))}${cc?line('Xarajatlar',m(-r.exp))+line('Ta’minotchiga to‘lov',m(-r.supPaid))+line('Egasi kiritdi / oldi',`${sp(r.ownIn)} / ${sp(r.ownOut)}`)+(r.kdiff?line('Kassa farqi',m(r.kdiff),r.kdiff<0?'cr':''):'')+line('Davr bo‘yicha sof pul oqimi',m(r.flow),'tot'):''}</div></div>
 <div class="rsec"><div class="sec-h">Chegirma va qaytarish</div><div class="sumbox">${line('Berilgan chegirmalar',m(r.disc))}${line('Qaytarilgan tovarlar',r.retN+' dona, '+m(r.retV))}</div></div>
 <div class="rsec"><div class="sec-h">Eng ko‘p sotilgan</div><div class="mlist">${byQ.map(([id,v])=>`<div class="mini"><span class="rm"><b>${esc(title(gp(+id)))}</b><span class="t2">${sp(v.rev)} so‘m</span></span><b>${v.q} dona</b></div>`).join('')||empty('Bu davrda sotuv yo‘q')}</div></div>

 <div class="rsec"><div class="sec-h">Kam qolgan aksessuarlar</div><div class="mlist">${low.map(p=>`<div class="mini"><span class="rm"><b>${esc(title(p))}</b><span class="t2">chegara ${p.min} dona</span></span><b class="${stock(p.id)?'cw':'cr'}">${stock(p.id)} dona</b></div>`).join('')||empty('Hammasi yetarli')}</div></div>
 ${cc?`<div class="rsec"><div class="sec-h">Ombor va qarzlar</div><div class="sumbox">${line('Omborda',stockUnits()+' dona')}${line('Ombor tannarx qiymati',m(stockValue()))}${line('Nosoz qurilmalar',S.units.filter(u=>u.status==='faulty').length+' dona')}${line('15+ / 30+ kun turgan',`${agingUnits(15,29).length} / ${agingUnits(30).length}`)}${line('Mijozlardan olinadigan',m(custDebtTotal()))}${line('Muddati o‘tgan qarzlar',overdue().length+' ta','cr')}${line('Ta’minotchilarga beriladigan',m(supDebt()))}</div></div>`:''}
 </div>
 <div class="qa"><button onclick="expSheet()">+ Xarajat</button><button onclick="copyCSV()">CSV nusxalash</button></div></section>`}
function copyCSV(){const [A,B]=perRange(),cc=canCost();const q=v=>`"${String(v).replace(/"/g,'""')}"`;
 const rows=[['№','Sana','Sotuvchi','Mijoz','Mahsulot','IMEI','Soni','Narx','Chegirma','Summa','Qaytarilgan','Holat',...(cc?['Tannarx','Yalpi foyda']:[])]];
 S.sales.filter(s=>{const k=dkey(s.date);return k>=A&&k<=B}).forEach(s=>s.items.forEach(it=>{const p=gp(it.pid),u=it.uid?gu(it.uid):null,c=s.cust?gc(s.cust):null,net=it.price*it.qty-it.disc;
  rows.push([s.no,fdt(s.date),s.seller,c?c.name:'',title(p),u?u.imei1:'',it.qty,it.price,it.disc,net,it.rv,s.cancelled?'bekor':'',...(cc?[it.cost,net-it.cost-(it.rv-it.rc)]:[])])}));
 const csv=rows.map(r=>r.map(q).join(';')).join('\n');copyText(csv,`${rows.length-1} qator nusxalandi`,'CSV')}
function copyText(t,okMsg,ttl){const fb=()=>sheet(`<h2>${ttl}</h2><p class="t2">Matnni belgilab nusxalang.</p><textarea rows="10" class="mono" readonly onclick="this.select()">${esc(t)}</textarea>`);
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast(okMsg,'ok'),fb);else fb()}

function saveExp(){const a=num($('#ea').value);if(!a)return toast('Summani kiriting','er');const d=$('#ed').value;if(!d)return toast('Sanani tanlang','er');
 S.expenses.push({id:nid(),date:d===dkey(Date.now())?Date.now():dateTs(d),cat:$('#ec').value,amount:a,method:$('#em').value,note:$('#en').value.trim(),by:me().name});log('Xarajat',`${$('#ec').value}, ${m(a)}`);save();render();expSheet();toast('Xarajat saqlandi','ok')}
function expEdit(id){if(!need('admin'))return;const e=S.expenses.find(x=>x.id===id);
 sheet(`<h2>Xarajatni tahrirlash</h2><div class="g2"><label class="fl">Turi<select id="xc">${ECATS.map(c=>`<option ${e.cat===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="fl">Usul${methSel('xm',e.method)}</label></div>
 <div class="g2"><label class="fl">Summa<input inputmode="numeric" id="xa" value="${e.amount}"></label><label class="fl">Sana<input type="date" id="xd" value="${dkey(e.date)}" max="${dkey(Date.now())}"></label></div><label class="fl">Izoh<input id="xn" value="${esc(e.note)}"></label>
 <button class="btn" onclick="saveExpEdit(${id})">Saqlash</button><button class="btn dgl" onclick="delExp(${id})">O‘chirish</button><button class="btn ghost" onclick="expSheet()">Orqaga</button>`)}
function saveExpEdit(id){if(!need('admin'))return;const e=S.expenses.find(x=>x.id===id);const a=num($('#xa').value),d=$('#xd').value;if(!a||!d)return toast('Summa va sanani kiriting','er');
 const old=`${e.cat}, ${e.amount}, ${dkey(e.date)}, ${e.method}`;e.cat=$('#xc').value;e.amount=a;e.method=$('#xm').value;e.note=$('#xn').value.trim();if(d!==dkey(e.date))e.date=dateTs(d);
 log('Xarajat tahrirlandi',`avval: ${old}; endi: ${e.cat}, ${a}, ${d}, ${e.method}`);save();render();expSheet();toast('Saqlandi','ok')}
function delExp(id){if(!need('admin'))return;const e=S.expenses.find(x=>x.id===id);askConfirm(`${e.cat}: ${sp(e.amount)} so‘m xarajati o‘chirilsinmi? Amallar jurnalida iz qoladi.`,()=>{e.del=true;log('Xarajat o‘chirildi',`${e.cat}, ${m(e.amount)}, ${fd(e.date)}`);save();render();expSheet();toast('O‘chirildi','ok')},'Ha, o‘chirish',true,()=>expEdit(id))}

function custListSheet(q){q=q||'';const ql=q.toLowerCase();const cs=S.customers.filter(c=>!ql||c.name.toLowerCase().includes(ql)||normPhone(c.phone).includes(ql.replace(/\D/g,'')||'§'));

 <button class="btn ghost" onclick="custSheet(0)">+ Yangi mijoz</button>
 <div class="mlist" style="margin-top:10px">${cs.map(c=>{const ss=S.sales.filter(s=>s.cust===c.id);const d=ss.reduce((a,s)=>a+Math.max(0,dueOf(s)),0);return `<button class="mini" onclick="custSheet(${c.id})"><span class="rm"><b>${esc(c.name)}</b><span class="t2">${esc(c.phone)}, ${ss.length} ta xarid</span></span>${d>0?`<b class="cr">${sp(d)}</b>`:''}${chv}</button>`}).join('')||empty('Mijoz topilmadi')}</div>`)}
function custSheet(id){const c=id?gc(id):{name:'',phone:'+998 ',note:''};const ss=id?S.sales.filter(s=>s.cust===id).reverse():[];const tot=ss.reduce((a,s)=>a+s.total-s.retV,0),d=ss.reduce((a,s)=>a+Math.max(0,dueOf(s)),0);
 sheet(`<h2>${id?esc(c.name):'Yangi mijoz'}</h2>${id?`<div class="kp">${kpi('Xaridlar',`${ss.length} ta, ${sp(tot)}`)}${kpi('Qarzi',m(d),d>0?'er':'')}</div>`:''}
 <div class="g2"><label class="fl">Ism<input id="cn" value="${esc(c.name)}"></label><label class="fl">Telefon<input id="cp" type="tel" value="${esc(c.phone)}"></label></div><label class="fl">Izoh<input id="cnote" value="${esc(c.note||'')}"></label>
 <button class="btn" onclick="saveCust(${id})">Saqlash</button>
 ${id?`<div class="sec-h">Xaridlar tarixi</div><div class="list">${ss.map(saleRow).join('')||empty('Xarid yo‘q')}</div>${!ss.length&&isAdmin()?`<button class="btn dgl" onclick="delCust(${id})">Mijozni o‘chirish</button>`:''}`:''}
 <button class="btn ghost" onclick="custListSheet()">Ro‘yxatga qaytish</button>`)}
function saveCust(id){const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n)return toast('Ismni kiriting','er');if(!validPhone(p))return toast('Telefon raqami noto‘g‘ri','er');
 if(S.customers.some(x=>x.id!==id&&normPhone(x.phone)===normPhone(p)))return toast('Bu raqam boshqa mijozda bor','er');
 if(id){const c=gc(id);log('Mijoz tahrirlandi',`${c.name}, ${c.phone} → ${n}, ${p}`);c.name=n;c.phone=p;c.note=$('#cnote').value.trim()}
 else{const c={id:nid(),name:n,phone:p,note:$('#cnote').value.trim()};S.customers.push(c);id=c.id;log('Mijoz qo‘shildi',n)}
 save();render();custSheet(id);toast('Saqlandi','ok')}
function delCust(id){if(!need('admin'))return;if(S.sales.some(s=>s.cust===id))return toast('Xaridi bor mijoz o‘chirilmaydi','er');const c=gc(id);
 askConfirm(`${c.name} o‘chirilsinmi?`,()=>{S.customers=S.customers.filter(x=>x.id!==id);log('Mijoz o‘chirildi',c.name);save();render();custListSheet()},'Ha, o‘chirish',true,()=>custSheet(id))}
function custDebtSheet(){const by={};S.sales.forEach(s=>{const d=dueOf(s);if(d>0&&s.cust)(by[s.cust]=by[s.cust]||[]).push(s)});const today=dkey(Date.now());

 ${Object.entries(by).map(([cid,ss])=>{const c=gc(+cid);return `<div class="mlist" style="margin-bottom:8px"><button class="mini" onclick="custSheet(${c.id})"><span class="rm"><b>${esc(c.name)}</b><span class="t2">${esc(c.phone)}</span></span><b class="cr">${sp(ss.reduce((a,s)=>a+dueOf(s),0))}</b></button>${ss.map(s=>{const od=s.dueDate&&dkey(s.dueDate)<today;return `<button class="row sm${isFlash('sale',s.id)?' flash':''}" onclick="saleSheet(${s.id})"><span class="rm"><span class="t1">Savdo №${s.no}</span><span class="t2 ${od?'cr':''}">${s.dueDate?(od?'Muddati o‘tgan: ':'Muddat: ')+fd(s.dueDate):'Muddat belgilanmagan'}</span></span><span class="rr"><b>${sp(dueOf(s))}</b></span></button>`}).join('')}</div>`}).join('')||empty('Qarzdor mijoz yo‘q')}`)}

function supSheet(){const cc=canCost();sheet(`<h2>Ta’minotchilar</h2>${isAdmin()?'<button class="btn ghost" onclick="supEdit(0)">+ Yangi ta’minotchi</button>':''}<div class="mlist" style="margin-top:10px">${S.suppliers.map(s=>{const d=supDebtOf(s.id);return `<button class="mini" onclick="supEdit(${s.id})"><span class="rm"><b>${esc(s.name)}</b><span class="t2">${esc(s.phone||'telefon yo‘q')}</span>${cc?`<span class="t2 ${d>0?'cr':''}">${d>=0?'Qarzimiz: '+m(d):'U bizga qarzdor: '+m(-d)}</span>`:''}</span>${chv}</button>`}).join('')||empty('Ta’minotchi yo‘q')}</div>`)}

 <div class="sec-h">To‘lovlar</div><div class="mlist">${pays.map(p=>`<div class="mini"><span class="rm"><b>${p.rev?'Bekor qilish':'To‘lov'}</b><span class="t2">${fdt(p.date)}, ${methName[p.method]}${p.by?', '+esc(p.by):''}</span></span><b>${sp(p.amount)}</b>${ad&&!p.rev&&!p.voided?`<button class="sbtn dgl" onclick="voidSupPay(${p.id})">Bekor</button>`:''}</div>`).join('')||empty('To‘lov yo‘q')}</div>`:''}
 ${id&&ad&&!pur.length&&!pays.length?`<button class="btn dgl" onclick="delSup(${id})">Ta’minotchini o‘chirish</button>`:''}

function saveSup(id){if(!need('admin'))return;const n=$('#sn1').value.trim();if(!n)return toast('Nomini kiriting','er');

 if(id){const s=gs(id);log('Ta’minotchi tahrirlandi',`${s.name} → ${n}`);s.name=n;s.phone=$('#sp1').value.trim()}else{id=addSup(n,$('#sp1').value.trim());log('Ta’minotchi qo‘shildi',n)}
 save();render();supEdit(id);toast('Saqlandi','ok')}

function voidSupPay(pid){if(!need('admin'))return;const p=S.supPays.find(x=>x.id===pid);askConfirm(`${sp(p.amount)} so‘mlik to‘lov bekor qilinsinmi? Qarshi yozuv qo‘shiladi.`,()=>{p.voided=true;S.supPays.push({id:nid(),sup:p.sup,date:Date.now(),amount:-p.amount,method:p.method,rev:p.id,by:me().name});log('Ta’minotchi to‘lovi bekor',`${gs(p.sup).name}, ${m(p.amount)}`);save();render();supEdit(p.sup)},'Ha, bekor qilish',true,()=>supEdit(p.sup))}
function delSup(id){if(!need('admin'))return;const s=gs(id);if(S.purchases.some(p=>p.sup===id)||S.supPays.some(p=>p.sup===id))return toast('Tarixi bor ta’minotchi o‘chirilmaydi','er');
 askConfirm(`${s.name} o‘chirilsinmi?`,()=>{S.suppliers=S.suppliers.filter(x=>x.id!==id);log('Ta’minotchi o‘chirildi',s.name);save();render();supSheet()},'Ha, o‘chirish',true,()=>supEdit(id))}

function userForm(id){if(!need('admin'))return;const u=id?S.users.find(x=>x.id===id):{name:'',login:'',role:'seller',perms:{kirim:true,ret:true,cost:false},active:true};const self=id===me().id;
 sheet(`<h2>${id?'Xodimni tahrirlash':'Yangi xodim'}</h2>
 <label class="fl">Ismi<input id="uf_n" value="${esc(u.name)}"></label>
 <label class="fl">Login<input id="uf_l" value="${esc(u.login)}" autocapitalize="none" spellcheck="false" autocomplete="off"></label>
 <label class="fl">Roli<select id="uf_r" onchange="$('#uf_p').classList.toggle('hide',this.value==='admin')" ${self?'disabled':''}><option value="seller" ${u.role==='seller'?'selected':''}>Sotuvchi</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin (hamma huquq)</option></select></label>
 <div id="uf_p" class="${u.role==='admin'?'hide':''}">${PERMS.map(([k,l])=>`<label class="tg">${l}<input type="checkbox" id="uf_${k}" ${u.perms?.[k]?'checked':''}></label>`).join('')}</div>
 ${id&&!self?`<label class="tg">Hisob faol (kira oladi)<input type="checkbox" id="uf_a" ${u.active?'checked':''}></label>`:''}
 <label class="fl">${id?'Yangi parol (o‘zgartirish uchun, aks holda bo‘sh qoldiring)':'Parol (kamida 8 belgi, harf va raqam)'}${pwField('uf_pw','','new-password')}</label>
 <label class="fl">Parolni takrorlang${pwField('uf_pw2','','new-password')}</label>
 <div class="err" id="uf_err"></div><button class="btn" id="uf_btn" onclick="saveUser(${id})">${id?'Saqlash':'Xodimni yaratish'}</button>
 ${id&&!self?`<button class="btn dgl" onclick="delUser(${id})">Xodimni o‘chirish</button>`:''}${self?'<p class="note">O‘z rolingizni o‘zgartira olmaysiz. O‘z parolingizni “Profilim”da yangilang.</p>':''}
 <button class="btn ghost" onclick="usersSheet()">Ro‘yxatga qaytish</button>`)}
async function saveUser(id){if(!need('admin'))return;const er=t=>{$('#uf_err').textContent=t};const name=$('#uf_n').value.trim(),login=$('#uf_l').value.trim().toLowerCase(),role=$('#uf_r').value,pw=$('#uf_pw').value,pw2=$('#uf_pw2').value;
 if(!name)return er('Ismni kiriting');if(!loginOk(login))return er('Login: 3–20 ta lotin harf, raqam, nuqta yoki chiziqcha');
 if(S.users.some(x=>x.id!==id&&x.login===login))return er('Bu login band');
 if(!id||pw){const pe=pwErr(pw,login);if(pe)return er(pe);if(pw!==pw2)return er('Parollar mos emas')}
 const u=id?S.users.find(x=>x.id===id):null;const active=id&&$('#uf_a')?$('#uf_a').checked:true;
 if(u&&u.role==='admin'&&u.active&&(role!=='admin'||!active)&&activeAdmins().length<=1)return er('Kamida bitta faol admin qolishi kerak');
 const btn=$('#uf_btn');setBusy(btn,true,'Saqlanmoqda…');
 try{const perms=role==='admin'?{}:Object.fromEntries(PERMS.map(([k])=>[k,$('#uf_'+k).checked]));
  if(u){const ch=[];if(u.name!==name)ch.push('ism');if(u.login!==login)ch.push('login');if(u.role!==role)ch.push('rol');if(JSON.stringify(u.perms)!==JSON.stringify(perms))ch.push('huquqlar');if(u.active!==active)ch.push(active?'faollashtirildi':'o‘chirildi');
   Object.assign(u,{name,login,role,perms,active});if(pw){const h=await hashPw(pw);u.salt=h.salt;u.hash=h.hash;u.ver++;ch.push('parol yangilandi')}
   if(u.id===me()?.id||u.id===SES?.uid)setSess(u);
   log('Xodim tahrirlandi',`${name}: ${ch.join(', ')||'o‘zgarish yo‘q'}`)}
  else{const h=await hashPw(pw);S.users.push({id:nid(),name,login,salt:h.salt,hash:h.hash,role,perms,active:true,ver:1,created:Date.now()});log('Xodim qo‘shildi',`${name} (${login}), ${role==='admin'?'admin':'sotuvchi'}`)}
  save();render();usersSheet();toast('Saqlandi','ok')}catch(e){setBusy(btn,false);er(e.message)}}
function delUser(id){if(!need('admin'))return;const u=S.users.find(x=>x.id===id);if(id===me().id)return toast('O‘zingizni o‘chira olmaysiz','er');
 if(u.role==='admin'&&u.active&&activeAdmins().length<=1)return toast('Oxirgi adminni o‘chirib bo‘lmaydi','er');
 askConfirm(`${u.name} (${u.login}) o‘chirilsinmi? Uning savdolari tarixda saqlanadi.`,()=>{S.users=S.users.filter(x=>x.id!==id);log('Xodim o‘chirildi',`${u.name} (${u.login})`);save();render();usersSheet()},'Ha, o‘chirish',true,()=>userForm(id))}
function profileSheet(){const u=me();sheet(`<h2>Profilim</h2><div class="sumbox">${line('Ism',esc(u.name))}${line('Login',esc(u.login))}${line('Rol',u.role==='admin'?'Admin':'Sotuvchi')}</div>
 <div class="sec-h">Parolni o‘zgartirish</div><label class="fl">Joriy parol${pwField('pf_o')}</label><label class="fl">Yangi parol${pwField('pf_n','','new-password')}</label><label class="fl">Yangi parolni takrorlang${pwField('pf_n2','','new-password')}</label>
 <div class="err" id="pf_err"></div><button class="btn" id="pf_btn" onclick="changeMyPw()">Parolni yangilash</button><button class="btn ghost" onclick="logout()">Chiqish</button>`)}
async function changeMyPw(){const u=me();const er=t=>{$('#pf_err').textContent=t};const o=$('#pf_o').value,n=$('#pf_n').value,n2=$('#pf_n2').value;
 if(!o)return er('Joriy parolni kiriting');const pe=pwErr(n,u.login);if(pe)return er(pe);if(n!==n2)return er('Yangi parollar mos emas');if(o===n)return er('Yangi parol eskisidan farq qilsin');
 const btn=$('#pf_btn');setBusy(btn,true);
 try{const h0=await hashPw(o,u.salt);if(!same(h0.hash,u.hash)){setBusy(btn,false);log('Parol o‘zgartirish xatosi','joriy parol noto‘g‘ri');save();return er('Joriy parol noto‘g‘ri')}
  const h=await hashPw(n);u.salt=h.salt;u.hash=h.hash;u.ver++;setSess(u);log('Parol o‘zgartirildi',u.login);save();closeSheet();render();toast('Parol yangilandi','ok')}catch(e){setBusy(btn,false);er(e.message)}}

/* ---------- Buyurtmalar, eslatmalar, audit, sozlamalar ---------- */
const OST=['yangi','bog‘lanildi','tasdiqlandi','yakunlandi','bekor qilindi'];
const ostC={yangi:'b','bog‘lanildi':'y',tasdiqlandi:'y',yakunlandi:'g','bekor qilindi':'n'};
function ordersSheet(){const os=[...S.orders].reverse();
 sheet(`<h2>Magazin buyurtmalari</h2><p class="note" style="margin-top:0">Buyurtma savdo emas. Mijoz bilan bog‘lanib, “Savdoga aylantirish” bosilganda mavjudlik qayta tekshiriladi.</p>
 ${os.map(o=>{const tot=o.items.reduce((a,i)=>a+(gp(i.pid)?.price||0)*i.qty,0);const open=!['yakunlandi','bekor qilindi'].includes(o.status);
 return `<div class="cl"><div class="cl-h"><span class="rm"><b>№${o.id}. ${esc(o.name)}</b><span class="t2">${esc(o.phone)}, ${fdt(o.date)}</span><span class="t2">${esc(o.delivery)}${o.address?': '+esc(o.address):''}</span>${o.comment?`<span class="t2">“${esc(o.comment)}”</span>`:''}</span><span class="bdg ${ostC[o.status]}">${o.status}</span></div>
 <div class="t2" style="margin-top:6px">${o.items.map(i=>`${esc(title(gp(i.pid)))} × ${i.qty}`).join('<br>')}</div><div style="margin-top:4px"><b>${m(tot)}</b></div>
 ${open?`<div class="g2" style="margin-top:8px"><select onchange="setOrderSt(${o.id},this.value)" aria-label="Holat">${OST.filter(s=>s!=='yakunlandi').map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="sbtn" onclick="convertOrder(${o.id})">Savdoga aylantirish</button></div>`:`<div class="row2">${o.saleId?`<button class="sbtn ghost" onclick="saleSheet(${o.saleId})">Savdoni ochish</button>`:''}${o.status==='bekor qilindi'&&isAdmin()?`<button class="sbtn dgl" onclick="delOrder(${o.id})">O‘chirish</button>`:''}</div>`}</div>`}).join('')||empty('Buyurtma yo‘q')}`)}
function setOrderSt(id,st){const o=S.orders.find(x=>x.id===id);log('Buyurtma holati',`№${id}: ${o.status} → ${st}`);o.status=st;save();render();ordersSheet();toast('Holat yangilandi','ok')}
function delOrder(id){if(!need('admin'))return;askConfirm(`Bekor qilingan buyurtma №${id} o‘chirilsinmi?`,()=>{S.orders=S.orders.filter(x=>x.id!==id);log('Buyurtma o‘chirildi','№'+id);save();render();ordersSheet()},'Ha, o‘chirish',true,ordersSheet)}
function convertOrder(id){const o=S.orders.find(x=>x.id===id);const lines=[];
 for(const it of o.items){const p=gp(it.pid);if(!p||p.archived)return toast('Mahsulot endi sotuvda yo‘q','er');
  if(p.cat==='acc'){if(stock(p.id)<it.qty)return toast(`${title(p)}: omborda ${stock(p.id)} dona`,'er');lines.push({pid:p.id,qty:it.qty,price:p.price,disc:0})}
  else{const av=S.units.filter(u=>u.pid===p.id&&u.status==='stock').sort((a,b)=>a.inDate-b.inDate);if(av.length<it.qty)return toast(`${title(p)}: mavjud emas, mijozga xabar bering`,'er');av.slice(0,it.qty).forEach(u=>lines.push({pid:p.id,uid:u.id,qty:1,price:p.price,disc:0}))}}
 const c=S.customers.find(x=>normPhone(x.phone)===normPhone(o.phone));
 S.ui.scart=lines;S.ui.scust=c?{id:c.id}:{id:'new',name:o.name,phone:o.phone};S.ui.pay={cash:0,card:0};S.ui.fromOrder=id;S.ui.token=null;
 if(['yangi','bog‘lanildi'].includes(o.status))o.status='tasdiqlandi';log('Buyurtma savdoga',`№${id}`);closeSheet();go('sale');toast('Savatcha to‘ldirildi. To‘lovni kiriting.','ok')}
function notifSheet(){const ns=S.notifs.filter(n=>!n.silent).reverse().slice(0,80);
 sheet(`<h2>Eslatmalar</h2><p class="note" style="margin-top:0">15 va 30 kun to‘lganda va qarz muddati o‘tganda bir martadan eslatma yoziladi, takrorlanmaydi.</p>
 <div class="mlist">${ns.map(n=>{if(n.type==='debt'){const s=gsale(n.sale);return `<div class="mini" style="${n.read?'opacity:.7':''}"><span class="rm"><span class="bdg r">qarz</span><b>${esc(n.text)}</b><span class="t2">${fdt(n.date)}${s&&dueOf(s)<=0?', endi to‘langan':''}</span></span>${s?`<button class="sbtn ghost" onclick="saleSheet(${s.id})">Ochish</button>`:''}</div>`}
  const u=gu(n.uid);const sold=!u||u.status!=='stock';return `<div class="mini" style="${n.read?'opacity:.7':''}"><span class="rm"><span class="bdg ${n.th>=30?'r':'y'}">${n.th} kun</span><b>${esc(n.text)}</b><span class="t2">${fdt(n.date)}${sold?', endi omborda emas':''}</span></span>${u&&!sold?`<button class="sbtn ghost" onclick="prodSheet(${u.pid})">Ochish</button>`:''}</div>`}).join('')||empty('Eslatma yo‘q')}</div>`);
 let ch=false;S.notifs.forEach(n=>{if(!n.read){n.read=true;ch=true}});if(ch){save();render()}}
function auditSheet(){if(!need('admin'))return;sheet(`<h2>Amallar jurnali</h2><div class="mlist">${S.audit.slice(-100).reverse().map(a=>`<div class="mini"><span class="rm"><b>${esc(a.action)}</b><span class="t2">${esc(a.detail)}</span><span class="t2">${fdt(a.date)}, ${esc(a.user)}</span></span></div>`).join('')}</div>`)}
function settingsSheet(){if(!need('admin'))return;let used=0;try{used=(localStorage.getItem(KEY)||'').length}catch(e){}const pct=Math.min(100,Math.round(used/5e6*100));
 sheet(`<h2>Sozlamalar</h2><label class="fl">Do‘kon nomi<input id="sn" value="${esc(S.settings.shop)}"></label>
 <div class="g2"><label class="fl">Chegirma limiti, %<input inputmode="numeric" id="sd" value="${S.settings.discLimit}"></label><label class="fl">Dollar kursi<input inputmode="numeric" id="sr" value="${S.settings.rate}"></label></div>
 <div class="g2"><label class="fl">Nasiya muddati, kun<input inputmode="numeric" id="sdd" value="${S.settings.debtDays}"></label><label class="fl">Aksessuar kam chegarasi<input inputmode="numeric" id="sm" value="${S.settings.minAcc}"></label></div>
 <button class="btn" onclick="saveSettings()">Saqlash</button>
 <div class="sec-h">Xotira</div><div class="sumbox">${line('Band',`${pct}% (${Math.round(used/1024)} KB)`, pct>80?'cr':'')}<div class="bar"><i style="width:${pct}%"></i></div><p class="t2">Rasmlar ko‘p joy oladi. 80% dan oshsa, zaxira oling va keraksiz rasmlarni o‘chiring.</p></div>
 <div class="sec-h">Zaxira nusxa</div><p class="note" style="margin-top:0">Nusxada parollarning shifrlangan izi bor — uni faqat o‘zingizda saqlang (Telegram “Saqlanganlar”, Google Drive).</p>
 <button class="btn ghost" onclick="exportData()">Zaxira nusxani olish</button><button class="btn ghost" onclick="importSheet()">Zaxiradan tiklash</button>
 <div class="sec-h">Magazin havolasi</div><p class="note" style="margin-top:0">Xaridorlarga havolaning oxiriga <b>#magazin</b> qo‘shib yuboring — ular faqat katalogni ko‘radi.</p>
 <div class="sec-h">Xavfli</div><button class="btn dg" onclick="askConfirm('BARCHA ma’lumotlar (tovarlar, savdolar, xodimlar) o‘chadi. Avval zaxira olganmisiz?',wipeAll,'Ha, hammasini o‘chirish',true,settingsSheet)">Barcha ma’lumotlarni o‘chirish</button>`)}
function saveSettings(){if(!need('admin'))return;const n=$('#sn').value.trim();if(!n)return toast('Do‘kon nomini kiriting','er');S.settings.shop=n;S.settings.discLimit=Math.min(100,num($('#sd').value));S.settings.rate=num($('#sr').value)||S.settings.rate;S.settings.debtDays=Math.max(1,num($('#sdd').value)||30);S.settings.minAcc=num($('#sm').value);log('Sozlamalar','yangilandi');save();closeSheet();render();toast('Saqlandi','ok')}
function exportData(){if(!need('admin'))return;const d={...S,ui:undefined};copyText(JSON.stringify({app:'telefon-dokon',v:2,exported:new Date().toISOString(),data:d}),'Zaxira nusxa nusxalandi. Uni xavfsiz joyga joylang.','Zaxira nusxa');log('Zaxira olindi','');save()}
function importSheet(){if(!need('admin'))return;sheet(`<h2>Zaxiradan tiklash</h2><p class="t2">Zaxira matnini shu yerga joylang. Hozirgi ma’lumotlar to‘liq almashtiriladi.</p><textarea id="imp" rows="8" class="mono"></textarea><button class="btn dg" onclick="doImport()">Tiklash</button><button class="btn ghost" onclick="settingsSheet()">Orqaga</button>`)}
function doImport(){let o;try{o=JSON.parse($('#imp').value)}catch(e){return toast('Matn noto‘g‘ri: JSON emas','er')}
 const d=o?.data;const arr=['products','units','batches','sales','payments','users'];if(o?.app!=='telefon-dokon'||!d||!arr.every(k=>Array.isArray(d[k]))||!d.users.length||!d.users.every(u=>u.hash&&u.salt))return toast('Bu bu ilovaning zaxira nusxasi emas','er');
 askConfirm(`Zaxira (${o.exported||'sana noma’lum'}): ${d.products.length} mahsulot, ${d.sales.length} savdo, ${d.users.length} xodim. Hozirgi ma’lumotlar almashtirilsinmi?`,()=>{S=d;ensure();log('Zaxiradan tiklandi',o.exported||'','Tizim');clearSess();save();render();toast('Tiklandi. Zaxiradagi login bilan kiring.','ok')},'Ha, tiklash',true,importSheet)}
function wipeAll(){try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY)}catch(e){}clearSess();S=blank();ensure();render();toast('Barcha ma’lumotlar o‘chirildi')}
function moreV(){const ad=isAdmin(),no=S.orders.filter(o=>o.status==='yangi').length,un=S.notifs.filter(n=>!n.read&&!n.silent).length;
 const it=(ico,t,s,fn,show=true)=>show?`<button class="row sm" onclick="${fn}"><span class="av">${ico}</span><span class="rm"><span class="t1">${t}</span>${s?`<span class="t2">${s}</span>`:''}</span>${chv}</button>`:'';
 return `<section class="pad"><div class="list">

 ${it('💳','Mijozlar qarzi',m(custDebtTotal())+(overdue().length?`, ${overdue().length} ta muddati o‘tgan`:''),'custDebtSheet()')}
 ${it('🚚','Ta’minotchilar',canCost()?'Qarzimiz: '+m(supDebt()):'', 'supSheet()')}
 ${it('💵','Kassa',canCost()?'Naqd: '+m(kassa().cash):'Yopish va sanash','kassaSheet()')}
 ${it('🧾','Xarajatlar','', 'expSheet()')}
 ${it('🏦','Egasi kassasi','Pul kiritish va olish','ownerSheet()',ad)}
 ${it('🔔','Eslatmalar',un?un+' ta o‘qilmagan':'15 / 30 kun va qarz muddati','notifSheet()')}
 </div><div class="list" style="margin-top:12px">
 ${it('🧑‍💼','Xodimlar',`${S.users.length} ta, login va parollar`,'usersSheet()',ad)}
 ${it('📋','Amallar jurnali','Kim, qachon, nima qildi','auditSheet()',ad)}
 ${it('⚙️','Sozlamalar','Zaxira, xotira, limitlar','settingsSheet()',ad)}
 ${it('🔑','Profilim',`${esc(me().name)}, parolni o‘zgartirish`,'profileSheet()')}
 </div><div class="list" style="margin-top:12px">${it('📱','Magazinni ochish','Xaridor ko‘rinishi','openShop()')}${it('↩','Chiqish','','logout()')}</div>
 <p class="note">Prototip: ma’lumotlar shu qurilmaning brauzerida saqlanadi. Ko‘p qurilmada umumiy baza va server tomonidagi himoya — server versiyasida.</p></section>`}

/* ---------- Xaridor magazini (Mini App) ---------- */
function publicCatalog(){/* faqat ochiq maydonlar: tannarx, IMEI, ta’minotchi, ichki izohlar YO‘Q */
 return S.products.filter(p=>!p.archived&&stock(p.id)>0).map(p=>({id:p.id,cat:p.cat,brand:p.brand,model:p.model,mem:p.mem,color:p.color,cond:p.cond,price:p.price,desc:p.desc,img:p.img,avail:stock(p.id),created:p.id}))}
function openShop(){S.ui.shop=true;S.ui.sl=20;save();closeSheet();render();window.scrollTo(0,0)}
function closeShop(){S.ui.shop=false;save();render();window.scrollTo(0,0)}
function shopV(){const q=(S.ui.shq||'').trim().toLowerCase(),f=S.ui.sf;
 let list=publicCatalog().filter(p=>{if(['phone','tablet','acc'].includes(f)&&p.cat!==f)return false;if(f==='new'&&p.cond!=='new')return false;if(f==='used'&&p.cond!=='used')return false;
  if(q&&!`${p.brand} ${p.model} ${p.mem} ${p.color}`.toLowerCase().includes(q))return false;return true});
 list.sort(S.ui.ss==='cheap'?(a,b)=>a.price-b.price:S.ui.ss==='exp'?(a,b)=>b.price-a.price:(a,b)=>b.created-a.created);
 const total=list.length;list=list.slice(0,S.ui.sl);const prevSl=_shownSl;_shownSl=list.length;S.ui.cart=S.ui.cart.filter(c=>gp(c.pid));const cnt=S.ui.cart.reduce((a,c)=>a+c.qty,0);
 const chips=[['all','Hammasi'],['phone','Telefonlar'],['tablet','Planshetlar'],['acc','Aksessuarlar'],['new','Yangi'],['used','Ishlatilgan']];
 const card=(p,i)=>S.ui.view==='grid'?`<div class="card${prevSl&&i>=prevSl?' pop':''}"><button style="border:0;padding:0;background:none;text-align:left" onclick="shopDetail(${p.id})" aria-label="${esc(p.brand+' '+p.model)}">${p.img?`<img class="im" src="${p.img}" alt="" loading="lazy">`:`<div class="im ph" style="aspect-ratio:1/1">${wm()}</div>`}</button><div class="cb"><span class="t1">${esc(p.brand+' '+p.model)}</span><span class="t2">${esc(p.mem||catName[p.cat])}${p.cond==='used'?', ishlatilgan':''}</span><span class="pr">${sp(p.price)} so‘m</span><button class="add" onclick="addToCart(${p.id},event)">Savatchaga</button></div></div>`
  :`<div class="row${prevSl&&i>=prevSl?' pop':''}" style="min-height:76px">${thumb(p)}<button class="rm" style="border:0;background:none;text-align:left;padding:0" onclick="shopDetail(${p.id})"><span class="t1">${esc(p.brand+' '+p.model)}</span><span class="t2">${esc(p.mem||catName[p.cat])}${p.cond==='used'?', ishlatilgan':''}</span><b>${sp(p.price)} so‘m</b></button><button class="sbtn ghost" onclick="addToCart(${p.id},event)" aria-label="Savatchaga">+</button></div>`;
 return `<header class="top">${SHOP_ONLY?'':`<button class="ib" onclick="closeShop()" aria-label="Orqaga">‹</button>`}<img class="hmark" src="${MARK}" alt=""><div class="rm"><div class="t1 brand">${esc(S.settings.shop)}</div><div class="t2">Onlayn magazin</div></div>
 <button class="ib" onclick="myOrders()" aria-label="Buyurtmalarim">${ic.list}</button><button class="ib" onclick="shopCart()" aria-label="Savatcha">${ic.cart}${cnt?`<i class="dot">${cnt}</i>`:''}</button></header>
 <div class="shero"><img src="${LOGO}" alt="${esc(S.settings.shop)}"><p>Telefonlar, planshetlar va aksessuarlar</p></div><div class="stick"><div class="search">${ic.search}<input type="search" placeholder="Model qidirish" value="${esc(S.ui.shq||'')}" oninput="shqIn(this.value)" aria-label="Qidiruv"></div>
 <div class="chips">${chips.map(([k,l])=>`<button class="chip ${f===k?'on':''}" onclick="S.ui.sf='${k}';S.ui.sl=20;save();render()">${l}</button>`).join('')}</div>
 <div class="row2" style="margin-top:6px"><select onchange="S.ui.ss=this.value;save();render()" aria-label="Saralash"><option value="new" ${S.ui.ss==='new'?'selected':''}>Avval yangilari</option><option value="cheap" ${S.ui.ss==='cheap'?'selected':''}>Arzonroq</option><option value="exp" ${S.ui.ss==='exp'?'selected':''}>Qimmatroq</option></select>
 <div class="seg"><button class="${S.ui.view==='grid'?'on':''}" onclick="S.ui.view='grid';save();render()" aria-label="Grid">${ic.grid}</button><button class="${S.ui.view==='list'?'on':''}" onclick="S.ui.view='list';save();render()" aria-label="Ro‘yxat">${ic.list}</button></div></div></div>
 <div class="${S.ui.view==='grid'?'grid':'list'}" ${S.ui.view==='list'?'style="margin:0 12px"':''}>${list.map(card).join('')}</div>${!total?empty('Mos mahsulot topilmadi'):''}
 ${total>list.length?`<div class="pad"><button class="btn ghost" onclick="S.ui.sl+=20;render()">Yana ko‘rsatish (${total-list.length})</button></div>`:''}<div style="height:30px"></div>`}
function shqIn(v){S.ui.shq=v;deb(()=>{render();const i=document.querySelector('.stick input');if(i){i.focus();i.setSelectionRange(v.length,v.length)}})}
function shopDetail(id){const p=publicCatalog().find(x=>x.id===id);if(!p)return toast('Bu mahsulot sotib bo‘lingan','er');
 sheet(`${p.img?`<img class="big-img" src="${p.img}" alt="">`:`<div class="big-img ph" style="height:200px;display:grid">${wm()}</div>`}<h2>${esc(p.brand+' '+p.model)}</h2>
 <div class="t2">${catName[p.cat]}${p.mem?', '+esc(p.mem):''}${p.color?', '+esc(p.color):''}, ${p.cond==='used'?'ishlatilgan':'yangi'}</div>
 ${p.desc?`<p>${esc(p.desc)}</p>`:''}<div class="sumbox">${line('Narxi',m(p.price),'tot')}${line('Mavjud',p.avail>3?'bor':p.avail+' dona')}</div><button class="btn" onclick="addToCart(${id},event);closeSheet()">Savatchaga qo‘shish</button>`)}
function addToCart(id,ev){const p=publicCatalog().find(x=>x.id===id);if(!p)return toast('Mavjud emas','er');const c=S.ui.cart.find(x=>x.pid===id);
 if(c){if(c.qty+1>p.avail)return toast(`Faqat ${p.avail} dona mavjud`,'er');c.qty++}else S.ui.cart.push({pid:id,qty:1});
 let r0=null,src=p.img;const host=ev?.currentTarget?.closest?.('.card,.row,.sh');const im=host?.querySelector('.im,.th,.big-img');if(im)r0=im.getBoundingClientRect();
 save();render();flyTo(r0,src,document.querySelector('button[aria-label=Savatcha]'));toast('Savatchaga qo‘shildi','ok')}
function cartQty(i,d){const c=S.ui.cart[i];const av=stock(c.pid);c.qty+=d;if(c.qty>av){c.qty=av;toast(`Faqat ${av} dona mavjud`,'er')}if(c.qty<1)S.ui.cart.splice(i,1);save();render();shopCart()}
function shopCart(){const cs=S.ui.cart.filter(c=>gp(c.pid));const tot=cs.reduce((a,c)=>a+gp(c.pid).price*c.qty,0);
 sheet(`<h2>Savatcha</h2>${cs.length?`<div class="mlist">${cs.map((c,i)=>{const p=gp(c.pid);return `<div class="mini">${thumb(p)}<span class="rm"><b>${esc(p.brand+' '+p.model)}</b><span class="t2">${sp(p.price)} so‘m</span></span><span class="qty"><button onclick="cartQty(${i},-1)" aria-label="Kamaytirish">−</button><b>${c.qty}</b><button onclick="cartQty(${i},1)" aria-label="Ko‘paytirish">+</button></span></div>`}).join('')}</div>
 <div class="sumbox">${line('Jami',m(tot),'tot')}</div>
 <div class="sec-h">Aloqa</div><label class="fl">Ismingiz<input id="on1" autocomplete="name" maxlength="60"></label><label class="fl">Telefon<input id="op" type="tel" value="+998 " autocomplete="tel"></label>
 <label class="fl">Qabul qilish<select id="od" onchange="$('#oaw').classList.toggle('hide',this.value!=='yetkazish')"><option value="olib ketish">Do‘kondan olib ketaman</option><option value="yetkazish">Yetkazib berish</option></select></label>
 <label class="fl hide" id="oaw">Manzil<input id="oad" maxlength="200"></label><label class="fl">Izoh<input id="ocm" placeholder="Masalan: rangi, vaqti" maxlength="300"></label>
 <p class="note">Bu buyurtma so‘rovi. Sotuvchi siz bilan bog‘lanib, mavjudlikni tasdiqlaydi.</p><button class="btn" id="obtn" onclick="submitOrder()">Buyurtma yuborish</button>`:empty('Savatcha bo‘sh. Katalogdan tanlang.')}`)}
let _lastOrder=0;
function submitOrder(){const name=$('#on1').value.trim(),ph=$('#op').value.trim(),dl=$('#od').value,ad=$('#oad').value.trim();
 if(!name)return toast('Ismingizni kiriting','er');if(!validPhone(ph))return toast('Telefon raqamini to‘liq kiriting','er');if(dl==='yetkazish'&&!ad)return toast('Manzilni kiriting','er');
 if(Date.now()-_lastOrder<30000)return toast('Buyurtma yuborildi. Yangisini 30 soniyadan keyin yuboring.','er');
 for(const c of S.ui.cart)if(stock(c.pid)<c.qty)return toast(`${title(gp(c.pid))} endi mavjud emas`,'er');
 $('#obtn').disabled=true;_lastOrder=Date.now();
 const o={id:nid(),date:Date.now(),name,phone:ph,delivery:dl,address:ad,comment:$('#ocm').value.trim(),items:S.ui.cart.map(c=>({...c})),status:'yangi',saleId:null};
 S.orders.push(o);S.ui.myOrders.push(o.id);S.ui.cart=[];log('Yangi buyurtma',`№${o.id}, ${name}`,'Xaridor');save();render();closeSheet();okFx();toast(`Buyurtma №${o.id} yuborildi`,'ok');myOrders()}
function myOrders(){const os=S.orders.filter(o=>S.ui.myOrders.includes(o.id)).reverse();
 sheet(`<h2>Mening buyurtmalarim</h2><p class="note" style="margin-top:0">Faqat shu qurilmadan yuborilgan buyurtmalar ko‘rinadi.</p>
 <div class="mlist">${os.map(o=>`<div class="mini"><span class="rm"><b>№${o.id}</b><span class="t2">${fdt(o.date)}</span><span class="t2">${o.items.map(i=>esc(title(gp(i.pid)))+' × '+i.qty).join(', ')}</span></span><span class="bdg ${ostC[o.status]}">${o.status}</span></div>`).join('')||empty('Hali buyurtma yo‘q')}</div>`)}

/* ---------- internet va sessiya nazorati ---------- */
function netBanner(){document.querySelectorAll('.off').forEach(x=>x.remove());if(!navigator.onLine){const b=document.createElement('div');b.className='off';b.textContent='Internet yo‘q. Yangi savdo saqlanmaydi.';document.body.appendChild(b)}}
window.addEventListener('online',()=>{netBanner();toast('Internet tiklandi','ok')});window.addEventListener('offline',netBanner);
setInterval(()=>{if(SES&&!me()&&!S.ui.shop&&!SHOP_ONLY){closeSheet();clearSess();render();toast('Sessiya tugadi. Qayta kiring.')}},60000);

load();render();netBanner();
(()=>{const sp=document.getElementById('splash');if(!sp)return;const t=matchMedia('(prefers-reduced-motion: reduce)').matches?300:1100;
 setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500)},t)})();
/* PWA: faqat ilova qobig‘i keshlanadi, ma’lumotlar emas */
if('serviceWorker' in navigator&&window.isSecureContext&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
